spring.datasource.url=jdbc:h2:mem:skillbridge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=change-this-secret-key-change-this-secret-key
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173
app.bootstrap.admin-email=admin@test.local
app.bootstrap.admin-password=Admin123!
app.bootstrap.admin-first-name=Test
app.bootstrap.admin-last-name=Admin
app.security.max-login-attempts=5
app.security.login-lock-minutes=1
app.security.login-attempt-window-minutes=15
app.oauth.google.allowed-audiences=test-google-client-id.apps.googleusercontent.com
app.oauth.github.client-id=test-github-client-id
app.oauth.github.client-secret=test-github-client-secret
app.oauth.github.redirect-uri=http://localhost:5173/login
