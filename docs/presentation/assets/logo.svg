<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cc5a27"/>
      <stop offset="100%" stop-color="#e2703a"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#704429"/>
      <stop offset="50%" stop-color="#452715"/>
      <stop offset="100%" stop-color="#704429"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 40) scale(0.7)">
    <!-- Bridge Pillars -->
    <rect x="120" y="50" width="12" height="80" fill="#704429"/>
    <rect x="260" y="50" width="12" height="80" fill="#704429"/>
    
    <!-- Cables -->
    <path d="M40,130 L126,50 M126,50 L196,105 M196,105 L266,50 M266,50 L360,130" stroke="#704429" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Vertical supports -->
    <line x1="80" y1="90" x2="80" y2="120" stroke="#704429" stroke-width="2.5"/>
    <line x1="160" y1="80" x2="160" y2="100" stroke="#704429" stroke-width="2.5"/>
    <line x1="230" y1="80" x2="230" y2="100" stroke="#704429" stroke-width="2.5"/>
    <line x1="310" y1="90" x2="310" y2="120" stroke="#704429" stroke-width="2.5"/>

    <!-- Left side path -->
    <path d="M20,150 L60,115 L100,140 Z" fill="#b85f33"/>
    <path d="M40,155 L80,125 L120,150 Z" fill="#91451f"/>
    <path d="M60,165 L100,135 L140,160 Z" fill="#693014"/>

    <!-- Bridge Arch -->
    <path d="M20,150 Q200,90 380,150 L360,160 Q200,115 50,160 Z" fill="url(#bridgeGrad)"/>

    <!-- The Sweeping Arrow -->
    <path d="M80,120 Q180,90 310,10" fill="none" stroke="url(#arrowGrad)" stroke-width="14" stroke-linecap="round"/>
    <polygon points="295,0 330,0 320,35" fill="#e2703a"/>

    <!-- Open Book -->
    <path d="M170,160 L196,168 L222,160" fill="none" stroke="#704429" stroke-width="3" stroke-linecap="round"/>
    <path d="M170,170 L196,178 L222,170" fill="none" stroke="#704429" stroke-width="3" stroke-linecap="round"/>
    <path d="M170,180 L196,188 L222,180" fill="none" stroke="#704429" stroke-width="3" stroke-linecap="round"/>
    <line x1="196" y1="168" x2="196" y2="188" stroke="#704429" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="350" y="165" font-family="'Fraunces', 'Source Serif 4', Georgia, serif" font-size="80" font-weight="bold" fill="#3E2723">
    Skill<tspan fill="#E67E22">Bridge</tspan>
  </text>
  <text x="355" y="215" font-family="sans-serif" font-size="18" font-weight="bold" letter-spacing="0.3em" fill="#8D6E63">
    IDEAS. SKILLS. ROADMAPS. FUTURES.
  </text>
</svg>
