<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">SkillBridge terminal-first Big Data batch pipeline</title>
  <desc id="desc">Datasets are cleaned into a catalog, loaded into PostgreSQL mirror, imported by Sqoop into HDFS, queried by Hive, processed by MapReduce, enriched by Python, and served by HBase summaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ed"/>
      <stop offset="1" stop-color="#ead5c7"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="1">
      <stop offset="0" stop-color="#2b1712"/>
      <stop offset="1" stop-color="#cc5f38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3b2017" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#cc5f38"/>
    </marker>
  </defs>
  <rect width="1280" height="700" fill="url(#bg)"/>
  <text x="64" y="72" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#261b18">SkillBridge: Terminal Big Data Pipeline</text>
  <text x="64" y="108" font-family="Arial, sans-serif" font-size="18" fill="#6f5b54">This path proves the academic Big Data technologies independently from the live web request.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="60" y="170" width="170" height="88" rx="22" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="84" y="205" font-size="18" font-weight="700" fill="#261b18">Kaggle ZIPs</text>
    <text x="84" y="232" font-size="14" fill="#6f5b54">CSV/JSON raw data</text>

    <rect x="290" y="170" width="190" height="88" rx="22" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="314" y="205" font-size="18" font-weight="700" fill="#261b18">Catalog Builder</text>
    <text x="314" y="232" font-size="14" fill="#6f5b54">clean + deduplicate</text>

    <rect x="540" y="170" width="210" height="88" rx="22" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="564" y="205" font-size="18" font-weight="700" fill="#261b18">output/catalog</text>
    <text x="564" y="232" font-size="14" fill="#6f5b54">CSV staging files</text>

    <rect x="810" y="170" width="190" height="88" rx="22" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="834" y="205" font-size="18" font-weight="700" fill="#261b18">PostgreSQL Mirror</text>
    <text x="834" y="232" font-size="14" fill="#6f5b54">local Docker DB</text>

    <rect x="1060" y="170" width="160" height="88" rx="22" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="1084" y="205" font-size="18" font-weight="700" fill="#261b18">Sqoop</text>
    <text x="1084" y="232" font-size="14" fill="#6f5b54">batch import</text>

    <rect x="180" y="350" width="170" height="88" rx="22" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="204" y="385" font-size="18" font-weight="700" fill="#261b18">HDFS Raw Zone</text>
    <text x="204" y="412" font-size="14" fill="#6f5b54">sqoop + flume files</text>

    <rect x="430" y="350" width="160" height="88" rx="22" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="454" y="385" font-size="18" font-weight="700" fill="#261b18">Hive</text>
    <text x="454" y="412" font-size="14" fill="#6f5b54">SQL on HDFS</text>

    <rect x="660" y="350" width="190" height="88" rx="22" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="684" y="385" font-size="18" font-weight="700" fill="#261b18">MapReduce</text>
    <text x="684" y="412" font-size="14" fill="#6f5b54">top keywords job</text>

    <rect x="920" y="350" width="170" height="88" rx="22" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="944" y="385" font-size="18" font-weight="700" fill="#261b18">Python ETL</text>
    <text x="944" y="412" font-size="14" fill="#6f5b54">stats + matching</text>

    <rect x="430" y="535" width="170" height="88" rx="22" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="454" y="570" font-size="18" font-weight="700" fill="#261b18">HBase</text>
    <text x="454" y="597" font-size="14" fill="#6f5b54">course_stats table</text>

    <rect x="690" y="535" width="250" height="88" rx="22" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="714" y="570" font-size="18" font-weight="700" fill="#261b18">JSON Summaries</text>
    <text x="714" y="597" font-size="14" fill="#6f5b54">dashboard reads generated outputs</text>
  </g>

  <path d="M230 214 H290" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M480 214 H540" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M750 214 H810" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1000 214 H1060" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1140 258 C1140 332 350 296 265 350" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M350 394 H430" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M590 394 H660" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M850 394 H920" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1005 438 C1005 512 600 500 515 535" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 580 H690" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="60" y="646" width="1160" height="36" rx="18" fill="url(#dark)" opacity="0.96"/>
  <text x="84" y="670" font-family="Arial, sans-serif" font-size="15" fill="white">Key idea: Hadoop enriches and analyzes large datasets in batch; Supabase remains the live transactional database.</text>
</svg>
