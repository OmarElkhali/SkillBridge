<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">SkillBridge real-time Big Data feedback loop</title>
  <desc id="desc">Web recommendation events are written by Spring Boot to events.log, then Flume streams them to HDFS while the user receives immediate recommendations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ed"/>
      <stop offset="1" stop-color="#f4d8c8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#cc5f38"/>
      <stop offset="1" stop-color="#2b1712"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3b2017" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#cc5f38"/>
    </marker>
  </defs>
  <rect width="1280" height="620" fill="url(#bg)"/>
  <text x="64" y="76" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#261b18">SkillBridge: Web Real-Time Big Data Loop</text>
  <text x="64" y="112" font-family="Arial, sans-serif" font-size="18" fill="#6f5b54">The user gets a fast Java recommendation, while the same action becomes a Big Data event for Flume, HDFS, Hive and MapReduce.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="70" y="190" width="170" height="92" rx="24" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="96" y="226" font-size="18" font-weight="700" fill="#261b18">React UI</text>
    <text x="96" y="254" font-size="14" fill="#6f5b54">Generate recommendations</text>

    <rect x="300" y="190" width="190" height="92" rx="24" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="326" y="226" font-size="18" font-weight="700" fill="#261b18">Spring Boot API</text>
    <text x="326" y="254" font-size="14" fill="#6f5b54">JWT, services, scoring</text>

    <rect x="550" y="130" width="210" height="92" rx="24" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="576" y="166" font-size="18" font-weight="700" fill="#261b18">Supabase PostgreSQL</text>
    <text x="576" y="194" font-size="14" fill="#6f5b54">Live app catalog</text>

    <rect x="550" y="260" width="210" height="92" rx="24" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="576" y="296" font-size="18" font-weight="700" fill="#261b18">events.log</text>
    <text x="576" y="324" font-size="14" fill="#6f5b54">JSON Lines event stream</text>

    <rect x="820" y="260" width="160" height="92" rx="24" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="846" y="296" font-size="18" font-weight="700" fill="#261b18">Flume</text>
    <text x="846" y="324" font-size="14" fill="#6f5b54">tail -F -> HDFS</text>

    <rect x="1040" y="260" width="170" height="92" rx="24" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="1066" y="296" font-size="18" font-weight="700" fill="#261b18">HDFS raw events</text>
    <text x="1066" y="324" font-size="14" fill="#6f5b54">/raw/flume/events</text>

    <rect x="300" y="420" width="270" height="92" rx="24" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="326" y="456" font-size="18" font-weight="700" fill="#261b18">Immediate response</text>
    <text x="326" y="484" font-size="14" fill="#6f5b54">Ranked courses + score breakdown</text>

    <rect x="700" y="420" width="300" height="92" rx="24" fill="#fffaf4" stroke="#e9c8b8"/>
    <text x="726" y="456" font-size="18" font-weight="700" fill="#261b18">Admin Control Room</text>
    <text x="726" y="484" font-size="14" fill="#6f5b54">Reads summaries through Spring Boot APIs</text>
  </g>

  <path d="M240 236 H300" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M490 214 C520 190 520 176 550 176" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M490 258 C520 284 520 306 550 306" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M760 306 H820" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M980 306 H1040" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M395 282 V420" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1125 352 C1125 450 1030 466 1000 466" stroke="#cc5f38" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="70" y="546" width="1140" height="36" rx="18" fill="url(#accent)" opacity="0.96"/>
  <text x="94" y="570" font-family="Arial, sans-serif" font-size="15" fill="white">Key idea: the web request stays fast, but every recommendation/search/save becomes an observable Big Data event.</text>
</svg>
